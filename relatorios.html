<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios de Ocupação — UPAs</title>
<style>
  :root{
    --bg: #f5f7f8;
    --panel: #ffffff;
    --field: #f5f7f8;
    --border: #e1e7ea;
    --text: #1c2b33;
    --text-dim: #6d7c85;
    --accent: #0d7a8c;
    --accent-dark: #0a5f6e;
    --vermelho: #d84b3e;
    --verde: #3fa869;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 24px 60px;
  }
  .wrap{ max-width: 1100px; margin: 0 auto; }

  .header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap: wrap;
    gap: 14px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .eyebrow{
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin: 0 0 6px;
  }
  h1{ margin:0; font-size: 24px; font-weight: 700; }
  a.back{ font-size: 13px; color: var(--accent); text-decoration:none; font-weight:700; }
  a.back:hover{ text-decoration: underline; }

  .panel{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 24px;
  }

  .filtros{
    display:flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items:flex-end;
    margin-bottom: 4px;
  }
  .campo{ display:flex; flex-direction:column; gap:6px; min-width: 160px; }
  .campo label{ font-size: 12.5px; font-weight:700; color: var(--text-dim); }
  select, input[type=date]{
    padding: 10px 12px;
    font-size: 14px;
    background: var(--field);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
  }
  .custom-datas{ display:none; gap: 14px; }
  .custom-datas.show{ display:flex; }

  button.gerar{
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor:pointer;
  }
  button.gerar:hover{ background: var(--accent-dark); }
  button.gerar:disabled{ opacity:.5; cursor:not-allowed; }

  button.csv{
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    background: var(--panel);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    cursor:pointer;
  }
  button.csv:hover{ background: var(--accent); color: #fff; }

  .resultado-header{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .resultado-header .info{ font-size: 13px; color: var(--text-dim); }

  table{
    width:100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  th, td{
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th{
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-dim);
    font-weight: 700;
  }
  td.num{ text-align:right; font-variant-numeric: tabular-nums; }
  tr.overcap td.destaque{ color: var(--vermelho); font-weight: 700; }
  .tipo-tag{
    font-size: 10.5px;
    font-weight:700;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--field);
    color: var(--text-dim);
  }

  .modo-toggle{
    display:flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .modo-toggle button{
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor:pointer;
  }
  .modo-toggle button.active{
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
  }
  .aviso-limite{
    font-size: 12.5px;
    color: #97600d;
    background: #fdf1de;
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 12px;
  }

  .empty{ text-align:center; padding: 40px 20px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">

<div class="header">
  <div>
    <p class="eyebrow">Rede de Urgência e Emergência · PBH</p>
    <h1>Relatórios de Ocupação</h1>
  </div>
  <a class="back" href="dashboard.html">← Voltar ao dashboard</a>
</div>

<div class="panel">
  <div class="modo-toggle">
    <button id="modo-resumo" class="active">Resumo (médias por período)</button>
    <button id="modo-detalhado">Detalhado (cada lançamento, com data/hora)</button>
  </div>

  <div class="filtros">
    <div class="campo">
      <label for="periodo">Período</label>
      <select id="periodo">
        <option value="1">Hoje / últimas 24h</option>
        <option value="2">Últimas 48h</option>
        <option value="7">Semanal (últimos 7 dias)</option>
        <option value="30" selected>Mensal (últimos 30 dias)</option>
        <option value="182">Semestral (últimos 6 meses)</option>
        <option value="365">Anual (últimos 12 meses)</option>
        <option value="custom">Período customizado…</option>
      </select>
    </div>

    <div class="campo custom-datas" id="custom-datas">
      <div>
        <label for="data-inicio">De</label>
        <input type="date" id="data-inicio">
      </div>
      <div>
        <label for="data-fim">Até</label>
        <input type="date" id="data-fim">
      </div>
    </div>

    <div class="campo">
      <label for="unidade">Unidade</label>
      <select id="unidade">
        <option value="todas">Todas as unidades</option>
      </select>
    </div>

    <div class="campo">
      <label for="tipo">Tipo</label>
      <select id="tipo">
        <option value="todos">Sala Vermelha + Enfermarias</option>
        <option value="sala_vermelha">Só Sala Vermelha</option>
        <option value="enfermaria">Só Enfermaria Adulto</option>
        <option value="enfermaria_pediatrica">Só Enfermaria Pediátrica</option>
      </select>
    </div>

    <button class="gerar" id="btn-gerar">Gerar relatório</button>
  </div>
</div>

<div class="panel" id="resultado" style="display:none;">
  <div class="resultado-header">
    <div class="info" id="resultado-info"></div>
    <button class="csv" id="btn-csv">⬇ Baixar CSV</button>
  </div>
  <div id="tabela-area"></div>
</div>

<div class="empty" id="estado-vazio">Escolha um período e clique em "Gerar relatório".</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---------------------------------------------------------------------
  // CONFIGURE AQUI (mesmos valores dos outros arquivos)
  const SUPABASE_URL = 'https://mxlvavyrpishwbijkjec.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_tnVZxgDJ93Ry_08ezdd3LA_s7_GDfyz';
  // ---------------------------------------------------------------------

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const tipoLabel = { sala_vermelha: 'Sala Vermelha', enfermaria: 'Enfermaria Adulto', enfermaria_pediatrica: 'Enfermaria Pediátrica' };

  const LIMITE_DETALHADO = 1000;

  let modo = 'resumo'; // 'resumo' | 'detalhado'
  let ultimoResultado = [];

  const periodoSelect = document.getElementById('periodo');
  const customDatas = document.getElementById('custom-datas');
  const unidadeSelect = document.getElementById('unidade');

  periodoSelect.addEventListener('change', () => {
    customDatas.classList.toggle('show', periodoSelect.value === 'custom');
  });

  document.getElementById('modo-resumo').addEventListener('click', (e) => {
    modo = 'resumo';
    document.getElementById('modo-resumo').classList.add('active');
    document.getElementById('modo-detalhado').classList.remove('active');
  });
  document.getElementById('modo-detalhado').addEventListener('click', (e) => {
    modo = 'detalhado';
    document.getElementById('modo-detalhado').classList.add('active');
    document.getElementById('modo-resumo').classList.remove('active');
  });

  async function carregarUnidades() {
    const { data } = await sb.from('unidades').select('id, nome').order('ordem');
    (data || []).forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = u.nome;
      unidadeSelect.appendChild(opt);
    });
  }
  carregarUnidades();

  function calcularIntervalo() {
    const val = periodoSelect.value;
    const fim = new Date();
    let inicio;

    if (val === 'custom') {
      const ini = document.getElementById('data-inicio').value;
      const fimStr = document.getElementById('data-fim').value;
      if (!ini || !fimStr) {
        alert('Preencha as duas datas do período customizado.');
        return null;
      }
      inicio = new Date(ini + 'T00:00:00');
      const fimCustom = new Date(fimStr + 'T23:59:59');
      return { inicio, fim: fimCustom };
    }

    const dias = parseFloat(val);
    inicio = new Date(fim.getTime() - dias * 24 * 60 * 60 * 1000);
    return { inicio, fim };
  }

  function fmtData(d) {
    return d.toLocaleDateString('pt-BR');
  }
  function fmtDataHora(iso) {
    return new Date(iso).toLocaleString('pt-BR');
  }

  async function gerarRelatorio() {
    const intervalo = calcularIntervalo();
    if (!intervalo) return;

    const btn = document.getElementById('btn-gerar');
    btn.disabled = true;
    btn.textContent = 'Gerando…';

    if (modo === 'resumo') {
      await gerarResumo(intervalo);
    } else {
      await gerarDetalhado(intervalo);
    }

    btn.disabled = false;
    btn.textContent = 'Gerar relatório';
  }

  async function gerarResumo(intervalo) {
    const { data, error } = await sb.rpc('relatorio_ocupacao', {
      p_inicio: intervalo.inicio.toISOString(),
      p_fim: intervalo.fim.toISOString()
    });

    if (error) {
      alert('Erro ao gerar relatório: ' + error.message);
      return;
    }

    const tipoFiltro = document.getElementById('tipo').value;
    const unidadeFiltro = unidadeSelect.value;
    let linhas = data || [];
    if (tipoFiltro !== 'todos') linhas = linhas.filter(l => l.tipo === tipoFiltro);
    if (unidadeFiltro !== 'todas') linhas = linhas.filter(l => l.unidade_id === unidadeFiltro);

    ultimoResultado = linhas;
    renderResumo(linhas, intervalo);
  }

  async function gerarDetalhado(intervalo) {
    const tipoFiltro = document.getElementById('tipo').value;
    const unidadeFiltro = unidadeSelect.value;

    let query = sb.from('v_registros_detalhado')
      .select('*')
      .gte('registrado_em', intervalo.inicio.toISOString())
      .lt('registrado_em', intervalo.fim.toISOString())
      .order('registrado_em', { ascending: false })
      .limit(LIMITE_DETALHADO);

    if (tipoFiltro !== 'todos') query = query.eq('tipo', tipoFiltro);
    if (unidadeFiltro !== 'todas') query = query.eq('unidade_id', unidadeFiltro);

    const { data, error } = await query;

    if (error) {
      alert('Erro ao gerar relatório: ' + error.message);
      return;
    }

    ultimoResultado = data || [];
    renderDetalhado(data || [], intervalo);
  }

  function renderResumo(linhas, intervalo) {
    const resultado = document.getElementById('resultado');
    const estadoVazio = document.getElementById('estado-vazio');
    const info = document.getElementById('resultado-info');
    const tabelaArea = document.getElementById('tabela-area');

    if (!linhas.length) {
      resultado.style.display = 'none';
      estadoVazio.style.display = 'block';
      estadoVazio.textContent = 'Nenhum registro encontrado nesse período.';
      return;
    }

    estadoVazio.style.display = 'none';
    resultado.style.display = 'block';
    info.textContent = `Período: ${fmtData(intervalo.inicio)} até ${fmtData(intervalo.fim)} · ${linhas.length} linha(s) · valores são médias/máximos do período`;

    tabelaArea.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Unidade</th>
            <th>Tipo</th>
            <th class="num">Leitos</th>
            <th class="num">Registros</th>
            <th class="num">Média ocupação</th>
            <th class="num">Máx. ocupação</th>
            <th class="num">Registros acima da capacidade</th>
            <th class="num">Máx. pacientes</th>
          </tr>
        </thead>
        <tbody>
          ${linhas.map(l => `
            <tr class="${l.registros_acima_capacidade > 0 ? 'overcap' : ''}">
              <td>${l.nome}</td>
              <td><span class="tipo-tag">${tipoLabel[l.tipo] || l.tipo}</span></td>
              <td class="num">${l.leitos_totais}</td>
              <td class="num">${l.total_registros}</td>
              <td class="num">${l.media_percentual}%</td>
              <td class="num">${l.max_percentual}%</td>
              <td class="num destaque">${l.registros_acima_capacidade}</td>
              <td class="num">${l.max_pacientes}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  function renderDetalhado(linhas, intervalo) {
    const resultado = document.getElementById('resultado');
    const estadoVazio = document.getElementById('estado-vazio');
    const info = document.getElementById('resultado-info');
    const tabelaArea = document.getElementById('tabela-area');

    if (!linhas.length) {
      resultado.style.display = 'none';
      estadoVazio.style.display = 'block';
      estadoVazio.textContent = 'Nenhum registro encontrado nesse período.';
      return;
    }

    estadoVazio.style.display = 'none';
    resultado.style.display = 'block';
    info.textContent = `Período: ${fmtData(intervalo.inicio)} até ${fmtData(intervalo.fim)} · ${linhas.length} lançamento(s), do mais recente ao mais antigo`;

    const avisoLimite = linhas.length >= LIMITE_DETALHADO
      ? `<div class="aviso-limite">⚠ Mostrando os ${LIMITE_DETALHADO} lançamentos mais recentes do período — restrinja a unidade, o tipo ou o período para ver tudo.</div>`
      : '';

    tabelaArea.innerHTML = `
      ${avisoLimite}
      <table>
        <thead>
          <tr>
            <th>Data/Hora</th>
            <th>Unidade</th>
            <th>Tipo</th>
            <th class="num">Pacientes</th>
            <th class="num">Leitos</th>
            <th class="num">Ocupação</th>
            <th>Registrado por</th>
          </tr>
        </thead>
        <tbody>
          ${linhas.map(l => `
            <tr class="${l.acima_capacidade ? 'overcap' : ''}">
              <td>${fmtDataHora(l.registrado_em)}</td>
              <td>${l.nome}</td>
              <td><span class="tipo-tag">${tipoLabel[l.tipo] || l.tipo}</span></td>
              <td class="num destaque">${l.pacientes_internados}</td>
              <td class="num">${l.leitos_totais}</td>
              <td class="num">${l.percentual_ocupacao}%</td>
              <td>${l.registrado_por || '—'}${l.registrado_cargo ? ' (' + l.registrado_cargo + ')' : ''}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  function baixarCSV() {
    if (!ultimoResultado.length) return;

    let header, linhasCSV;
    if (modo === 'resumo') {
      header = ['Unidade', 'Tipo', 'Leitos', 'Registros', 'Media(%)', 'Max(%)', 'RegistrosAcimaCapacidade', 'MaxPacientes'];
      linhasCSV = ultimoResultado.map(l => [
        l.nome, l.tipo, l.leitos_totais, l.total_registros, l.media_percentual, l.max_percentual, l.registros_acima_capacidade, l.max_pacientes
      ]);
    } else {
      header = ['DataHora', 'Unidade', 'Tipo', 'Pacientes', 'Leitos', 'Ocupacao(%)', 'AcimaCapacidade', 'RegistradoPor', 'Cargo'];
      linhasCSV = ultimoResultado.map(l => [
        fmtDataHora(l.registrado_em), l.nome, l.tipo, l.pacientes_internados, l.leitos_totais, l.percentual_ocupacao,
        l.acima_capacidade ? 'SIM' : 'NAO', l.registrado_por, l.registrado_cargo
      ]);
    }

    const csv = [header, ...linhasCSV].map(r => r.map(v => `"${v}"`).join(';')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `relatorio_ocupacao_${modo}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  document.getElementById('btn-gerar').addEventListener('click', gerarRelatorio);
  document.getElementById('btn-csv').addEventListener('click', baixarCSV);
</script>
</body>
</html>
