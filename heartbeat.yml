name: Heartbeat Supabase

# Roda automaticamente todo dia às 06:00 (horário de Brasília = 09:00 UTC),
# e também pode ser disparado manualmente pela aba "Actions" do GitHub
# (botão "Run workflow") para testar sem esperar o horário agendado.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer uma leitura simples no Supabase (mantém o projeto ativo)
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/resposta.json -w "%{http_code}" \
            "https://mxlvavyrpishwbijkjec.supabase.co/rest/v1/unidades?select=id&limit=1" \
            -H "apikey: sb_publishable_tnVZxgDJ93Ry_08ezdd3LA_s7_GDfyz" \
            -H "Authorization: Bearer sb_publishable_tnVZxgDJ93Ry_08ezdd3LA_s7_GDfyz")

          echo "Status HTTP: $HTTP_STATUS"
          cat /tmp/resposta.json

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Heartbeat falhou (status $HTTP_STATUS) — verifique se as chaves do Supabase ainda são válidas."
            exit 1
          fi

          echo "Heartbeat OK — projeto Supabase segue ativo."
